name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: go-tools-cli-linux-amd64
          - goos: linux
            goarch: arm64
            asset: go-tools-cli-linux-arm64
          - goos: windows
            goarch: amd64
            asset: go-tools-cli-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: go-tools-cli-windows-arm64.exe
          - goos: darwin
            goarch: amd64
            asset: go-tools-cli-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: go-tools-cli-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w" -o ${{ matrix.asset }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Generate checksums
        working-directory: dist
        run: sha256sum go-tools-cli-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/go-tools-cli-*
            dist/checksums.txt
